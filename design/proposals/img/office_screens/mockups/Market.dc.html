<!doctype html>
<html lang="en">

<title>Marketplace</title>

button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.onBg}}; font-family: {{t.body}}; display: flex; flex-direction: column; overflow: hidden; position: relative">

      <div style="display: flex; gap: 6px">

      </sc-for>
    </div>
    <section style="background: {{t.card}}; color: {{t.ink}}; border-top: {{t.cardTop}}; border-bottom: {{t.cardTop}}; border-left: {{t.cardSide}}; border-right: {{t.cardSide}}; border-radius: {{t.r}}; box-shadow: {{t.shadow}}; box-sizing: border-box; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px">

        <sc-for list="{{owned}}" as="o" hint-placeholder-count="3">
          <span style="display: flex; align-items: center; gap: 4px; padding: 3px 8px 3px 4px; background: {{t.tile}}; border-radius: {{t.pill}}; font-size: 12px; font-weight: 700"><img src="{{o.icon}}" alt="" style="width: 22px; height: 22px; object-fit: contain">{{o.name}} ×{{o.count}}</span>
        </sc-for>
      </div>
    </section>
    <h2 style="margin: 0; font-size: 14px; font-weight: 700; font-family: {{t.head}}; font-style: {{t.titleStyle}}; letter-spacing: {{t.headSpacing}}; text-transform: {{t.titleCase}}; color: {{t.onBg}}; padding-top: 2px">Buy</h2>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <article style="background: {{t.card}}; color: {{t.ink}}; border-top: {{t.cardTop}}; border-bottom: {{t.cardTop}}; border-left: {{t.cardSide}}; border-right: {{t.cardSide}}; border-radius: {{t.r}}; box-shadow: {{t.shadow}}; box-sizing: border-box; padding: 9px 10px; display: flex; gap: 10px; align-items: center">
        <div style="flex: 0 0 auto; width: 48px; height: 48px; background: {{t.tile}}; border-radius: {{t.rSmall}}; display: flex; align-items: center; justify-content: center">
          <img src="{{it.icon}}" alt="" style="width: 40px; height: 40px; object-fit: contain">
        </div>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13.5px; font-weight: 700; line-height: 1.2">{{it.name}}</span>
          <span style="font-size: 11.5px; line-height: 1.3; color: {{t.muted}}">{{it.effect}}</span>
          <span style="font-size: 11px; font-weight: 700; color: {{it.noteTone}}">{{it.note}}</span>
        </div>
        <div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 5px">
          <span style="font-size: 13px; font-weight: 700">{{it.price}}</span>
          <button aria-disabled="{{it.disabled}}" style="min-width: 64px; min-height: 36px; padding: 0 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; background: {{it.btnBg}}; color: {{it.btnInk}}; border: {{t.bw}} solid {{it.btnEdge}}; border-radius: {{t.pill}}; clip-path: {{t.clip}}; font-family: {{t.body}}">{{it.btn}}</button>
        </div>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
