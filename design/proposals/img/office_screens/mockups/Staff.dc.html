                <span style="padding: 2px 7px; font-size: 11px; font-weight: 700; background: {{t.tile}}; border-radius: {{t.pill}}">Rank {{p.rank}}</span>
                <span style="padding: 2px 7px; font-size: 11px; font-weight: 700; border: 1px solid {{p.loyalTone}}; color: {{p.loyalTone}}; border-radius: {{t.pill}}">{{p.loyalty}}</span>
              </div>
            </div>
            <svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex: 0 0 auto; color: {{t.muted}}"><path d="m2 2 6 6-6 6"/></svg>
          </article>
        </sc-for>
        <sc-for list="{{r.open}}" as="o" hint-placeholder-count="1">
          <button style="min-height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; cursor: pointer; background: transparent; color: {{t.onBg}}; border: 1.5px dashed {{t.onBgMuted}}; border-radius: {{t.r}}; font-family: {{t.body}}"><span>{{o.label}}</span><span style="font-size: 12px; color: {{t.onBgMuted}}">{{o.note}}</span></button>
        </sc-for>
      </section>
    </sc-for>
  </div>
  <div style="flex: 0 0 auto; padding: 10px 16px 14px 16px; border-top: {{t.footTop}}; background: {{t.bg}}">
    <button style="width: 100%; min-height: 48px; font-size: 15px; font-weight: 700; cursor: pointer; background: {{t.go}}; color: {{t.goInk}}; border: {{t.bw}} solid {{t.go}}; border-radius: {{t.pill}}; clip-path: {{t.clip}}; box-shadow: {{t.shadow}}; font-family: {{t.head}}; font-style: {{t.titleStyle}}; text-transform: {{t.titleCase}}; letter-spacing: {{t.headSpacing}}">Staff Assignments</button>
  </div>
</div>
</x-dc>
