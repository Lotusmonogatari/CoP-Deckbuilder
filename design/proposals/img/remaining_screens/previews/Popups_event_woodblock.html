<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pop-ups and notices (woodblock)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>




<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFE4CF; color: #1C1A17; font-family: 'Shippori Mincho B1', serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <img src="assets/OFFICE.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: rgba(28,26,23,.55)"></div>
  <div style="position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 18px 14px">
    <section role="dialog" aria-label="Event: The Temple Bell Needs a Ringer" style="background: #F8F1E3; color: #1C1A17; border-top: 2px solid #1C1A17; border-bottom: 2px solid #1C1A17; border-left: 2px solid #1C1A17; border-right: 2px solid #1C1A17; border-radius: 0px; box-shadow: 4px 4px 0 #C23B22; box-sizing: border-box; max-height: 100%; display: flex; flex-direction: column; overflow: hidden">
      <div style="padding: 14px 16px 8px 16px; display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span style="padding: 3px 9px; font-size: 11px; font-weight: 700; letter-spacing: .06em; background: #22305A; color: #F8F1E3; border-radius: 0px; clip-path: none; white-space: nowrap">SOMETHING COMES UP</span><span style="font-size: 12px; font-weight: 700; color: #4E463C">District · 1 h</span></div>
        <h1 style="margin: 0; font-family: 'Antaka Brush Display', 'Shippori Mincho B1', serif; font-size: 24px; font-style: normal; font-weight: 400; line-height: 1.15; text-transform: none; color: #1C1A17">The Temple Bell Needs a Ringer</h1>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 16px 12px 16px; display: flex; flex-direction: column; gap: 10px">
        <p style="margin: 0; font-size: 13.5px; line-height: 1.5">The Buddhist Temples Association is ringing the great bell at a hillside temple in Matsumae and asks you to take a turn. A neighbor mentions, quietly, that the bell tower roof leaks.</p>
        <div style="display: flex; gap: 6px; align-items: center"><img src="assets/BO19.png" alt="" style="width: 26px; height: 26px; object-fit: contain"><span style="font-size: 12px; font-weight: 700">Buddhist Temples Association</span></div>
        <div style="display: flex; flex-direction: column; gap: 7px">
          
            <button aria-disabled="false" style="width: 100%; min-height: 52px; padding: 9px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; font-size: 13.5px; font-weight: 700; line-height: 1.3; cursor: pointer; background: #EFE4CF; color: #1C1A17; border: 1px solid rgba(28,26,23,.22); border-radius: 0px; font-family: 'Shippori Mincho B1', serif; box-sizing: border-box; opacity: 1"><span>Take your turn at the bell and stay for tea</span><span style="font-size: 11.5px; font-weight: 600; color: #4E463C">1 h</span><span style="font-size: 11.5px; font-weight: 700; color: #A42A17"></span></button>
          
            <button aria-disabled="false" style="width: 100%; min-height: 52px; padding: 9px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; font-size: 13.5px; font-weight: 700; line-height: 1.3; cursor: pointer; background: #EFE4CF; color: #1C1A17; border: 1px solid rgba(28,26,23,.22); border-radius: 0px; font-family: 'Shippori Mincho B1', serif; box-sizing: border-box; opacity: 1"><span>Send a staff member with a donation for the repairs</span><span style="font-size: 11.5px; font-weight: 600; color: #4E463C">10,000円 · Miharu Daitani goes · 0 h of yours</span><span style="font-size: 11.5px; font-weight: 700; color: #A42A17"></span></button>
          
            <button aria-disabled="false" style="width: 100%; min-height: 52px; padding: 9px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; font-size: 13.5px; font-weight: 700; line-height: 1.3; cursor: pointer; background: #EFE4CF; color: #1C1A17; border: 1px solid rgba(28,26,23,.22); border-radius: 0px; font-family: 'Shippori Mincho B1', serif; box-sizing: border-box; opacity: 1"><span>Offer to speak for the roof at the next heritage debate</span><span style="font-size: 11.5px; font-weight: 600; color: #4E463C">Promise: 1 hour of your time within 72 hours</span><span style="font-size: 11.5px; font-weight: 700; color: #A42A17"></span></button>
          
        </div>
      </div>
      <div style="flex: 0 0 auto; padding: 12px 16px 16px 16px; display: flex; gap: 8px; border-top: 1px solid rgba(28,26,23,.22)">
        <button style="min-height: 44px; padding: 0 14px; font-size: 13.5px; font-weight: 700; cursor: pointer; background: transparent; color: #1C1A17; border: 2px solid #4E463C; border-radius: 0px; clip-path: none; font-family: 'Shippori Mincho B1', serif; flex: 1 1 auto">Follow-up later</button>
      </div>
    </section>
  </div>
</div>









</body>
</html>
