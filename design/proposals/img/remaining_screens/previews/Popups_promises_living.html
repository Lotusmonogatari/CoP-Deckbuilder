<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pop-ups and notices (living)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>








<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2B1D12; color: #FFF8EC; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <img src="assets/OFFICE.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: rgba(20,12,6,.62)"></div>
  <div style="position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 18px 14px">
    <section role="dialog" aria-label="Promises" style="background: #FFF8EC; color: #2B1D12; border-top: 1px solid #E2CFAF; border-bottom: 1px solid #E2CFAF; border-left: 1px solid #E2CFAF; border-right: 1px solid #E2CFAF; border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,.35); box-sizing: border-box; max-height: 100%; display: flex; flex-direction: column; overflow: hidden">
      <div style="padding: 14px 16px 8px 16px; display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span style="padding: 3px 9px; font-size: 11px; font-weight: 700; letter-spacing: .06em; background: #FFD58A; color: #2B1D12; border-radius: 12px; clip-path: none; white-space: nowrap">PROMISES</span><span style="font-size: 12px; font-weight: 700; color: #5C4A38">2 owed</span></div>
        <h1 style="margin: 0; font-family: 'Antaka Brush Display', 'Zen Kaku Gothic New', sans-serif; font-size: 24px; font-style: normal; font-weight: 400; line-height: 1.15; text-transform: none; color: #2B1D12">Promises</h1>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 16px 12px 16px; display: flex; flex-direction: column; gap: 10px">
        
          <article style="background: #F3E4C8; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; gap: 8px; align-items: center"><img src="assets/BO19.png" alt="" style="width: 28px; height: 28px; object-fit: contain"><span style="flex: 1 1 auto; font-size: 13.5px; font-weight: 700; line-height: 1.3">1 hour of your time for Buddhist Temples Association</span></div>
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
              <span style="font-size: 12px; font-weight: 700; color: #2B1D12">Due in 41 hours</span>
              <span style="padding: 3px 8px; font-size: 11.5px; font-weight: 700; background: #F3E4C8; color: #2B1D12; border-radius: 999px; white-space: nowrap; background: #FFF8EC">Keep it at your District office</span>
            </div>
            <button aria-disabled="true" style="min-height: 44px; padding: 0 14px; font-size: 13.5px; font-weight: 700; cursor: pointer; background: transparent; color: #2B1D12; border: 1px solid #5C4A38; border-radius: 999px; clip-path: none; font-family: 'Zen Kaku Gothic New', sans-serif; opacity: 0.55">Keep this promise</button>
            <span style="font-size: 11.5px; font-weight: 700; color: #A3261A">Keep it at your District office.</span>
          </article>
        
          <article style="background: #F3E4C8; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; gap: 8px; align-items: center"><img src="assets/BO07.png" alt="" style="width: 28px; height: 28px; object-fit: contain"><span style="flex: 1 1 auto; font-size: 13.5px; font-weight: 700; line-height: 1.3">10,000円 for Fisheries Cooperative</span></div>
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
              <span style="font-size: 12px; font-weight: 700; color: #A3261A">Due in 6 hours</span>
              <span style="padding: 3px 8px; font-size: 11.5px; font-weight: 700; background: #F3E4C8; color: #2B1D12; border-radius: 999px; white-space: nowrap; background: #FFF8EC">Keep it anywhere</span>
            </div>
            <button aria-disabled="false" style="min-height: 44px; padding: 0 14px; font-size: 13.5px; font-weight: 700; cursor: pointer; background: transparent; color: #2B1D12; border: 1px solid #5C4A38; border-radius: 999px; clip-path: none; font-family: 'Zen Kaku Gothic New', sans-serif; opacity: 1">Keep this promise</button>
            <span style="font-size: 11.5px; font-weight: 700; color: #A3261A"></span>
          </article>
        
      </div>
      <div style="flex: 0 0 auto; padding: 12px 16px 16px 16px; display: flex; gap: 8px; border-top: 1px solid rgba(43,29,18,.14)">
        <button style="min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 700; cursor: pointer; background: #FFD58A; color: #2B1D12; border: 1px solid #FFD58A; border-radius: 999px; clip-path: none; font-family: 'Zen Kaku Gothic New', sans-serif; font-style: normal; text-transform: none; letter-spacing: 0; flex: 1 1 auto">Close</button>
      </div>
    </section>
  </div>
</div>





</body>
</html>
