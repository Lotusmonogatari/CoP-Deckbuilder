<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Vote and stage results (living)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>




<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2B1D12; color: #FFF8EC; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <img src="assets/ST03.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: rgba(20,12,6,.62)"></div>
  <div style="position: relative; flex: 1 1 auto; min-height: 0; padding: 18px 14px; display: flex; flex-direction: column; justify-content: center">
    <section role="dialog" aria-label="Stage result" style="background: #FFF8EC; color: #2B1D12; border-top: 1px solid #E2CFAF; border-bottom: 1px solid #E2CFAF; border-left: 1px solid #E2CFAF; border-right: 1px solid #E2CFAF; border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,.35); box-sizing: border-box; max-height: 100%; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="padding: 3px 9px; font-size: 11px; font-weight: 700; letter-spacing: .06em; background: #2E6B34; color: #FFFFFF; border-radius: 12px; clip-path: none">STAGE WON</span><span style="font-size: 12px; font-weight: 700; color: #5C4A38">Committee Hearing · 2 of 3</span></div>
      <h1 style="margin: 0; font-family: 'Antaka Brush Display', 'Zen Kaku Gothic New', sans-serif; font-size: 24px; font-style: normal; font-weight: 400; line-height: 1.15; text-transform: none; font-size: 30px; color: #2B1D12">Taken care of</h1>
      <span style="font-size: 13.5px; line-height: 1.45">The support threshold was reached.</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        
          <div style="background: #F3E4C8; border-radius: 12px; padding: 7px 9px; display: flex; flex-direction: column"><span style="font-size: 11.5px">Constituency support</span><span style="font-size: 17px; font-weight: 700; color: #2E6B34">+2</span></div>
        
          <div style="background: #F3E4C8; border-radius: 12px; padding: 7px 9px; display: flex; flex-direction: column"><span style="font-size: 11.5px">Reputation</span><span style="font-size: 17px; font-weight: 700; color: #2E6B34">+1</span></div>
        
          <div style="background: #F3E4C8; border-radius: 12px; padding: 7px 9px; display: flex; flex-direction: column"><span style="font-size: 11.5px">Funds</span><span style="font-size: 17px; font-weight: 700; color: #2E6B34">+20,000円</span></div>
        
          <div style="background: #F3E4C8; border-radius: 12px; padding: 7px 9px; display: flex; flex-direction: column"><span style="font-size: 11.5px">XP</span><span style="font-size: 17px; font-weight: 700; color: #2E6B34">+15</span></div>
        
      </div>
      
        <div style="display: flex; flex-direction: column; gap: 5px; padding-top: 7px; border-top: 1px solid rgba(43,29,18,.14)">
          <span style="font-size: 12px; font-weight: 700; color: #2E6B34">Pleased</span>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            
              <button aria-label="Ainu Language and Culture Foundation" style="width: 44px; height: 44px; padding: 0; cursor: pointer; background: #F3E4C8; border: 1px solid rgba(43,29,18,.14); border-radius: 50%; display: flex; align-items: center; justify-content: center"><img src="assets/BO29.png" alt="" style="width: 32px; height: 32px; object-fit: contain"></button>
            
              <button aria-label="Students United" style="width: 44px; height: 44px; padding: 0; cursor: pointer; background: #F3E4C8; border: 1px solid rgba(43,29,18,.14); border-radius: 50%; display: flex; align-items: center; justify-content: center"><img src="assets/BO11.png" alt="" style="width: 32px; height: 32px; object-fit: contain"></button>
            
              <button aria-label="Local Kōenkai" style="width: 44px; height: 44px; padding: 0; cursor: pointer; background: #F3E4C8; border: 1px solid rgba(43,29,18,.14); border-radius: 50%; display: flex; align-items: center; justify-content: center"><img src="assets/BO03.png" alt="" style="width: 32px; height: 32px; object-fit: contain"></button>
            
          </div>
        </div>
      
        <div style="display: flex; flex-direction: column; gap: 5px; padding-top: 7px; border-top: 1px solid rgba(43,29,18,.14)">
          <span style="font-size: 12px; font-weight: 700; color: #A3261A">Annoyed</span>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            
              <button aria-label="Taxpayers' Alliance" style="width: 44px; height: 44px; padding: 0; cursor: pointer; background: #F3E4C8; border: 1px solid rgba(43,29,18,.14); border-radius: 50%; display: flex; align-items: center; justify-content: center"><img src="assets/BO23.png" alt="" style="width: 32px; height: 32px; object-fit: contain"></button>
            
          </div>
        </div>
      
      <span style="font-size: 11.5px; color: #5C4A38">Tap an organization to see its name.</span>
      <span style="font-size: 12.5px; font-weight: 700; padding-top: 6px; border-top: 1px solid rgba(43,29,18,.14)">You start 3 ahead at the floor debate.</span>
      <button style="min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 700; cursor: pointer; background: #FFD58A; color: #2B1D12; border: 1px solid #FFD58A; border-radius: 999px; clip-path: none; font-family: 'Zen Kaku Gothic New', sans-serif; font-style: normal; text-transform: none; letter-spacing: 0; margin-top: 4px">On to the next stage</button>
      <span style="font-size: 11px; color: #5C4A38; text-align: center">Hold for 2 seconds</span>
    </section>
  </div>
</div>


</body>
</html>
