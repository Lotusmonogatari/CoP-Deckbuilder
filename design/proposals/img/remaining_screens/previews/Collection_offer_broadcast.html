<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Cards and items (broadcast)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>




<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1220; color: #F4F1EA; font-family: 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <img src="assets/OFFICE.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: rgba(5,9,18,.66)"></div>
  <div style="position: relative; flex: 1 1 auto; padding: 18px 14px; display: flex; flex-direction: column; justify-content: center">
    <section role="dialog" aria-label="Your coach suggests" style="background: #141E33; color: #F4F1EA; border-top: 2px solid #E3B341; border-bottom: 2px solid #E3B341; border-left: 0px solid transparent; border-right: 0px solid transparent; border-radius: 0px; box-shadow: none; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center"><h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-style: italic; font-weight: 700; line-height: 1.15; text-transform: uppercase; color: #F4F1EA">Your coach suggests</h1><span style="padding: 3px 8px; font-size: 11.5px; font-weight: 700; background: #0E1728; color: #F4F1EA; border-radius: 0px; white-space: nowrap">1/3</span></div>
      
        <div style="width: 230px; align-self: center">
          <div style="position: relative; display: flex; flex-direction: column; background: #141E33; color: #F4F1EA; border: 2px solid #B3311C; border-radius: 0px; overflow: hidden; box-shadow: none">
            <img src="assets/C05.jpg" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block">
            <span style="position: absolute; left: 5px; top: 5px; width: 26px; height: 26px; border-radius: 50%; background: #B3311C; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
            <div style="padding: 6px 7px 7px 7px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12.5px; font-weight: 700; line-height: 1.2">Impassioned Speech</span>
              <span style="font-size: 10.5px; color: #B9C0CF">Emotional · Gain</span>
              <span style="font-size: 11px; line-height: 1.3">Gain 5.</span>
            </div>
          </div>
        </div>
      
      <span style="font-size: 12px; text-align: center; color: #B9C0CF">Tier 1 session · two more cards after this one</span>
      <div style="display: flex; gap: 8px">
        <button style="min-height: 44px; padding: 0 14px; font-size: 13.5px; font-weight: 700; cursor: pointer; background: transparent; color: #F4F1EA; border: 1px solid #B9C0CF; border-radius: 0px; clip-path: polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); font-family: 'Noto Sans JP', sans-serif; flex: 1 1 0">Pass</button>
        <button style="min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 700; cursor: pointer; background: #E3B341; color: #0B1220; border: 1px solid #E3B341; border-radius: 0px; clip-path: polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); font-family: 'Barlow Condensed', sans-serif; font-style: italic; text-transform: uppercase; letter-spacing: .04em; flex: 1.5 1 0; font-size: 14px">Learn it (40 XP)</button>
      </div>
    </section>
  </div>
</div>




</body>
</html>
