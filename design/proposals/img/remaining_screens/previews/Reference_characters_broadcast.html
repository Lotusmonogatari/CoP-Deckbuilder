<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Reference and settings (broadcast)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>





<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1220; color: #F4F1EA; font-family: 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 10px 16px 12px 16px; flex: 1 1 auto; min-height: 0; overflow-y: auto">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 44px; flex: 0 0 auto">
      <a href="#office" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px; font-size: 14px; font-weight: 600; text-decoration: none; color: #F4F1EA">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
        Office
      </a>
      <div style="display: flex; gap: 6px">
        
      </div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; flex: 0 0 auto">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 29px; font-style: italic; font-weight: 700; line-height: 1.1; text-transform: uppercase; color: #F4F1EA">Characters</h1>
      <span lang="ja" style="font-size: 12px; color: #9AA3B5">登場人物</span>
    </div>
    <div role="tablist" style="display: flex; gap: 6px; flex: 0 0 auto; overflow-x: auto">
      
    </div>
    <p style="margin: 0; font-size: 12.5px; color: #C3C9D6">Everyone you meet is recorded here. Tap a name to see who they are.</p>
    
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-size: 14px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; font-style: italic; letter-spacing: .04em; text-transform: uppercase; color: #F4F1EA">Those in the arena.</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
          
            <button style="min-height: 52px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; cursor: pointer; background: #141E33; color: #F4F1EA; border: 0; border-left: 5px solid #8000FF; border-radius: 0px; font-family: 'Noto Sans JP', sans-serif; text-align: left; opacity: 1">
              <span style="display: flex; flex-direction: column"><span style="font-size: 12.5px; font-weight: 700">Ayala Taiyounokage</span><span style="font-size: 10.5px; color: #B9C0CF">Five Point Independents</span></span>
            </button>
          
            <button style="min-height: 52px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; cursor: pointer; background: #141E33; color: #F4F1EA; border: 0; border-left: 5px solid #008000; border-radius: 0px; font-family: 'Noto Sans JP', sans-serif; text-align: left; opacity: 1">
              <span style="display: flex; flex-direction: column"><span style="font-size: 12.5px; font-weight: 700">Ichizaki Namu</span><span style="font-size: 10.5px; color: #B9C0CF">Frontier Party</span></span>
            </button>
          
            <button style="min-height: 52px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; cursor: pointer; background: #141E33; color: #F4F1EA; border: 0; border-left: 5px solid #9A9A9A; border-radius: 0px; font-family: 'Noto Sans JP', sans-serif; text-align: left; opacity: 0.6">
              <span style="display: flex; flex-direction: column"><span style="font-size: 12.5px; font-weight: 700">誰ですか。</span><span style="font-size: 10.5px; color: #B9C0CF">Not met yet</span></span>
            </button>
          
            <button style="min-height: 52px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; cursor: pointer; background: #141E33; color: #F4F1EA; border: 0; border-left: 5px solid #9A9A9A; border-radius: 0px; font-family: 'Noto Sans JP', sans-serif; text-align: left; opacity: 0.6">
              <span style="display: flex; flex-direction: column"><span style="font-size: 12.5px; font-weight: 700">誰ですか。</span><span style="font-size: 10.5px; color: #B9C0CF">Not met yet</span></span>
            </button>
          
        </div>
      </section>
    
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-size: 14px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; font-style: italic; letter-spacing: .04em; text-transform: uppercase; color: #F4F1EA">Those in the community.</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
          
            <button style="min-height: 52px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; cursor: pointer; background: #141E33; color: #F4F1EA; border: 0; border-left: 5px solid #2F6B9A; border-radius: 0px; font-family: 'Noto Sans JP', sans-serif; text-align: left; opacity: 1">
              <span style="display: flex; flex-direction: column"><span style="font-size: 12.5px; font-weight: 700">Gen Tsukamoto</span><span style="font-size: 10.5px; color: #B9C0CF">Fisherman</span></span>
            </button>
          
            <button style="min-height: 52px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; cursor: pointer; background: #141E33; color: #F4F1EA; border: 0; border-left: 5px solid #B7791F; border-radius: 0px; font-family: 'Noto Sans JP', sans-serif; text-align: left; opacity: 1">
              <span style="display: flex; flex-direction: column"><span style="font-size: 12.5px; font-weight: 700">Kaito Nishimura</span><span style="font-size: 10.5px; color: #B9C0CF">Student Council President</span></span>
            </button>
          
            <button style="min-height: 52px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; cursor: pointer; background: #141E33; color: #F4F1EA; border: 0; border-left: 5px solid #9A9A9A; border-radius: 0px; font-family: 'Noto Sans JP', sans-serif; text-align: left; opacity: 0.6">
              <span style="display: flex; flex-direction: column"><span style="font-size: 12.5px; font-weight: 700">誰ですか。</span><span style="font-size: 10.5px; color: #B9C0CF">Not met yet</span></span>
            </button>
          
            <button style="min-height: 52px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; cursor: pointer; background: #141E33; color: #F4F1EA; border: 0; border-left: 5px solid #9A9A9A; border-radius: 0px; font-family: 'Noto Sans JP', sans-serif; text-align: left; opacity: 0.6">
              <span style="display: flex; flex-direction: column"><span style="font-size: 12.5px; font-weight: 700">誰ですか。</span><span style="font-size: 10.5px; color: #B9C0CF">Not met yet</span></span>
            </button>
          
        </div>
      </section>
    
  </div>

</html>
