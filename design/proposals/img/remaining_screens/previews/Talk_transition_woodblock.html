<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Conversation screens (woodblock)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>






<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFE4CF; color: #1C1A17; font-family: 'Shippori Mincho B1', serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <img src="assets/ST03.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 30%, rgba(28,26,23,.55) 70%)"></div>
  <img src="assets/SF02.png" alt="Yui Kobayashi" style="position: absolute; left: -10px; bottom: 210px; height: 470px; width: auto">
  <img src="assets/PC01.png" alt="Kenshin Sako" style="position: absolute; right: -6px; bottom: 210px; height: 470px; width: auto">
  <div style="position: relative; display: flex; justify-content: space-between; padding: 12px 16px">
    <span style="padding: 4px 10px; font-size: 12px; font-weight: 700; background: #22305A; color: #F8F1E3; border-radius: 0px; clip-path: none">Between stages</span>
    <span style="padding: 4px 10px; font-size: 12px; font-weight: 700; background: #F8F1E3; color: #1C1A17; border-radius: 0px; clip-path: none">Next: Committee Hearing</span>
  </div>
  <div style="position: absolute; left: 14px; right: 14px; bottom: 96px; display: flex; flex-direction: column; gap: 10px">
    <div style="background: #F8F1E3; color: #1C1A17; border-top: 2px solid #1C1A17; border-bottom: 2px solid #1C1A17; border-left: 2px solid #1C1A17; border-right: 2px solid #1C1A17; border-radius: 0px; box-shadow: 4px 4px 0 #C23B22; box-sizing: border-box; padding: 10px 13px; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 11.5px; font-weight: 700; color: #4E463C">Yui Kobayashi · Policy Research Assistant</span>
      <span style="font-size: 15px; line-height: 1.45">Whatever happens next, the numbers are ready.</span>
    </div>
    <button style="width: 100%; min-height: 52px; padding: 9px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; font-size: 13.5px; font-weight: 700; line-height: 1.3; cursor: pointer; background: #EFE4CF; color: #1C1A17; border: 1px solid rgba(28,26,23,.22); border-radius: 0px; font-family: 'Shippori Mincho B1', serif; box-sizing: border-box; align-self: flex-end; width: auto; max-width: 300px; background: #22305A; color: #F8F1E3; border: 2px solid #22305A"><span style="font-size: 11px; font-weight: 700; opacity: .85">Your reply</span><span style="font-size: 14px">Let us hope they listen.</span></button>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px 16px; display: flex">
    <button style="min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 700; cursor: pointer; background: #22305A; color: #F8F1E3; border: 2px solid #22305A; border-radius: 0px; clip-path: none; font-family: 'Shippori Mincho B1', serif; font-style: normal; text-transform: none; letter-spacing: 0; flex: 1 1 auto">Continue</button>
  </div>
</div>



</body>
</html>
