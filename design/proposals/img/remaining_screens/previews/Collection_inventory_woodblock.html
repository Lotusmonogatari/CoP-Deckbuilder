<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Cards and items (woodblock)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>






<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFE4CF; color: #1C1A17; font-family: 'Shippori Mincho B1', serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 10px 16px 12px 16px; flex: 1 1 auto; min-height: 0; overflow-y: auto">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 44px; flex: 0 0 auto">
      <a href="#office" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px; font-size: 14px; font-weight: 600; text-decoration: none; color: #1C1A17">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
        Office
      </a>
      <div style="display: flex; gap: 6px">
        
          <span style="padding: 5px 10px; font-size: 12px; font-weight: 700; background: #22305A; color: #F8F1E3; border-radius: 0px; clip-path: none; white-space: nowrap">Personal</span>
        
      </div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; flex: 0 0 auto">
      <h1 style="margin: 0; font-family: 'Antaka Brush Display', 'Shippori Mincho B1', serif; font-size: 27px; font-style: normal; font-weight: 400; line-height: 1.1; text-transform: none; color: #1C1A17">Inventory</h1>
      <span lang="ja" style="font-size: 12px; color: #6B5F50">持ち物</span>
    </div>
    <div role="tablist" style="display: flex; gap: 6px; flex: 0 0 auto; overflow-x: auto">
      
        <button role="tab" style="flex: 0 0 auto; min-height: 36px; padding: 0 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; background: #22305A; color: #F8F1E3; border: 2px solid #22305A; border-radius: 0px; clip-path: none; font-family: 'Shippori Mincho B1', serif">Personal</button>
      
        <button role="tab" style="flex: 0 0 auto; min-height: 36px; padding: 0 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; background: #F8F1E3; color: #1C1A17; border: 2px solid #1C1A17; border-radius: 0px; clip-path: none; font-family: 'Shippori Mincho B1', serif">Office</button>
      
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      
        <button style="position: relative; min-height: 96px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; background: #F8F1E3; color: #1C1A17; border: 2px solid #22305A; border-radius: 0px; font-family: 'Shippori Mincho B1', serif; box-shadow: 4px 4px 0 #C23B22">
          <img src="assets/coffee.png" alt="" style="width: 46px; height: 46px; object-fit: contain">
          <span style="font-size: 11.5px; font-weight: 700; line-height: 1.2; text-align: center">“ね3” Coffee</span>
          <span style="position: absolute; right: 6px; top: 6px; padding: 3px 8px; font-size: 11.5px; font-weight: 700; background: #EFE4CF; color: #1C1A17; border-radius: 0px; white-space: nowrap; font-size: 11px">×2</span>
        </button>
      
        <button style="position: relative; min-height: 96px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; background: #F8F1E3; color: #1C1A17; border: 1px solid rgba(28,26,23,.22); border-radius: 0px; font-family: 'Shippori Mincho B1', serif; box-shadow: 4px 4px 0 #C23B22">
          <img src="assets/tea.png" alt="" style="width: 46px; height: 46px; object-fit: contain">
          <span style="font-size: 11.5px; font-weight: 700; line-height: 1.2; text-align: center">“ミレニ姫” Tea</span>
          <span style="position: absolute; right: 6px; top: 6px; padding: 3px 8px; font-size: 11.5px; font-weight: 700; background: #EFE4CF; color: #1C1A17; border-radius: 0px; white-space: nowrap; font-size: 11px">×1</span>
        </button>
      
        <button style="position: relative; min-height: 96px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; background: #F8F1E3; color: #1C1A17; border: 1px solid rgba(28,26,23,.22); border-radius: 0px; font-family: 'Shippori Mincho B1', serif; box-shadow: 4px 4px 0 #C23B22">
          <img src="assets/BOX_OF_AOMORI_APPLES.png" alt="" style="width: 46px; height: 46px; object-fit: contain">
          <span style="font-size: 11.5px; font-weight: 700; line-height: 1.2; text-align: center">Box of Aomori Apples</span>
          <span style="position: absolute; right: 6px; top: 6px; padding: 3px 8px; font-size: 11.5px; font-weight: 700; background: #EFE4CF; color: #1C1A17; border-radius: 0px; white-space: nowrap; font-size: 11px">×1</span>
        </button>
      
        <button style="position: relative; min-height: 96px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; background: #F8F1E3; color: #1C1A17; border: 1px solid rgba(28,26,23,.22); border-radius: 0px; font-family: 'Shippori Mincho B1', serif; box-shadow: 4px 4px 0 #C23B22">
          <img src="assets/WIND_DRIED_SALMON.png" alt="" style="width: 46px; height: 46px; object-fit: contain">
          <span style="font-size: 11.5px; font-weight: 700; line-height: 1.2; text-align: center">Wind-Dried Salmon</span>
          <span style="position: absolute; right: 6px; top: 6px; padding: 3px 8px; font-size: 11.5px; font-weight: 700; background: #EFE4CF; color: #1C1A17; border-radius: 0px; white-space: nowrap; font-size: 11px">×3</span>
        </button>
      
        <button style="position: relative; min-height: 96px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; background: #F8F1E3; color: #1C1A17; border: 1px solid rgba(28,26,23,.22); border-radius: 0px; font-family: 'Shippori Mincho B1', serif; box-shadow: 4px 4px 0 #C23B22">
          <img src="assets/walking_tour.png" alt="" style="width: 46px; height: 46px; object-fit: contain">
          <span style="font-size: 11.5px; font-weight: 700; line-height: 1.2; text-align: center">Walking Tour</span>
          <span style="position: absolute; right: 6px; top: 6px; padding: 3px 8px; font-size: 11.5px; font-weight: 700; background: #EFE4CF; color: #1C1A17; border-radius: 0px; white-space: nowrap; font-size: 11px">×1</span>
        </button>
      
    </div>
  </div>
  <section aria-label="Coffee" style="flex: 0 0 auto; background: #F8F1E3; color: #1C1A17; border-top: 2px solid #1C1A17; border-bottom: 2px solid #1C1A17; border-left: 2px solid #1C1A17; border-right: 2px solid #1C1A17; border-radius: 0px; box-shadow: 4px 4px 0 #C23B22; box-sizing: border-box; border-radius: 0px 0px 0 0; padding: 14px 16px 16px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; gap: 10px; align-items: center"><img src="assets/coffee.png" alt="" style="width: 44px; height: 44px; object-fit: contain"><div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">“ね3” Coffee</span><span style="font-size: 12px; color: #4E463C">You have 2. You can carry up to 3.</span></div></div>
    <span style="font-size: 12.5px">+1 energy. Takes effect immediately.</span>
    <div style="display: flex; gap: 8px"><button style="min-height: 44px; padding: 0 14px; font-size: 13.5px; font-weight: 700; cursor: pointer; background: transparent; color: #1C1A17; border: 2px solid #4E463C; border-radius: 0px; clip-path: none; font-family: 'Shippori Mincho B1', serif; flex: 1 1 0">Close</button><button style="min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 700; cursor: pointer; background: #22305A; color: #F8F1E3; border: 2px solid #22305A; border-radius: 0px; clip-path: none; font-family: 'Shippori Mincho B1', serif; font-style: normal; text-transform: none; letter-spacing: 0; flex: 1.5 1 0">Use</button></div>
  </section>
</div>


</body>
</html>
