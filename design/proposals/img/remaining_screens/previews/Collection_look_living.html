<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Cards and items (living)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>





<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2B1D12; color: #FFF8EC; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <img src="assets/OFFICE.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: rgba(20,12,6,.62)"></div>
  <div style="position: relative; flex: 1 1 auto; padding: 18px 14px; display: flex; flex-direction: column; justify-content: center">
    <section role="dialog" aria-label="Call for Unity" style="background: #FFF8EC; color: #2B1D12; border-top: 1px solid #E2CFAF; border-bottom: 1px solid #E2CFAF; border-left: 1px solid #E2CFAF; border-right: 1px solid #E2CFAF; border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,.35); box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      
        <div style="width: 210px; align-self: center">
          <div style="position: relative; display: flex; flex-direction: column; background: #FFF8EC; color: #2B1D12; border: 2px solid #B7791F; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,.35)">
            <img src="assets/C09.jpg" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block">
            <span style="position: absolute; left: 5px; top: 5px; width: 26px; height: 26px; border-radius: 50%; background: #B7791F; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
            <div style="padding: 6px 7px 7px 7px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12.5px; font-weight: 700; line-height: 1.2">Call for Unity</span>
              <span style="font-size: 10.5px; color: #5C4A38">Appeal · Gain</span>
              <span style="font-size: 11px; line-height: 1.3">Gain 4; +2 more if Party Members ≥ 50%.</span>
            </div>
          </div>
        </div>
      
      <span lang="ja" style="font-size: 12px; text-align: center; color: #5C4A38">結束を呼びかける · Kessoku o Yobikakeru</span>
      <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid rgba(43,29,18,.14)">
        <span style="font-size: 12.5px; font-weight: 700">Appeal · Gain · costs 2</span>
        <span style="font-size: 12.5px">Gain 4; +2 more if Party Members ≥ 50%.</span>
        <span style="font-size: 12px; color: #5C4A38">Tier 1 · in your deck</span>
      </div>
      <button style="min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 700; cursor: pointer; background: #FFD58A; color: #2B1D12; border: 1px solid #FFD58A; border-radius: 999px; clip-path: none; font-family: 'Zen Kaku Gothic New', sans-serif; font-style: normal; text-transform: none; letter-spacing: 0">Close</button>
    </section>
  </div>
</div>



</body>
</html>
