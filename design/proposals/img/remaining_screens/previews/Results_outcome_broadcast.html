<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Vote and stage results (broadcast)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>




<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1220; color: #F4F1EA; font-family: 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <img src="assets/ST03.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: rgba(5,9,18,.66)"></div>
  <div style="position: relative; flex: 1 1 auto; min-height: 0; padding: 18px 14px; display: flex; flex-direction: column; justify-content: center">
    <section role="dialog" aria-label="Stage result" style="background: #141E33; color: #F4F1EA; border-top: 2px solid #E3B341; border-bottom: 2px solid #E3B341; border-left: 0px solid transparent; border-right: 0px solid transparent; border-radius: 0px; box-shadow: none; box-sizing: border-box; max-height: 100%; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="padding: 3px 9px; font-size: 11px; font-weight: 700; letter-spacing: .06em; background: #7BD88F; color: #FFFFFF; border-radius: 0px; clip-path: polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)">STAGE WON</span><span style="font-size: 12px; font-weight: 700; color: #B9C0CF">Committee Hearing · 2 of 3</span></div>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-style: italic; font-weight: 700; line-height: 1.15; text-transform: uppercase; font-size: 30px; color: #F4F1EA">Taken care of</h1>
      <span style="font-size: 13.5px; line-height: 1.45">The support threshold was reached.</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        
          <div style="background: #0E1728; border-radius: 0px; padding: 7px 9px; display: flex; flex-direction: column"><span style="font-size: 11.5px">Constituency support</span><span style="font-size: 17px; font-weight: 700; color: #7BD88F">+2</span></div>
        
          <div style="background: #0E1728; border-radius: 0px; padding: 7px 9px; display: flex; flex-direction: column"><span style="font-size: 11.5px">Reputation</span><span style="font-size: 17px; font-weight: 700; color: #7BD88F">+1</span></div>
        
          <div style="background: #0E1728; border-radius: 0px; padding: 7px 9px; display: flex; flex-direction: column"><span style="font-size: 11.5px">Funds</span><span style="font-size: 17px; font-weight: 700; color: #7BD88F">+20,000円</span></div>
        
          <div style="background: #0E1728; border-radius: 0px; padding: 7px 9px; display: flex; flex-direction: column"><span style="font-size: 11.5px">XP</span><span style="font-size: 17px; font-weight: 700; color: #7BD88F">+15</span></div>
        
      </div>
      
        <div style="display: flex; flex-direction: column; gap: 5px; padding-top: 7px; border-top: 1px solid rgba(227,179,65,.22)">
          <span style="font-size: 12px; font-weight: 700; color: #7BD88F">Pleased</span>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            
              <button aria-label="Ainu Language and Culture Foundation" style="width: 44px; height: 44px; padding: 0; cursor: pointer; background: #0E1728; border: 1px solid rgba(227,179,65,.22); border-radius: 0px; display: flex; align-items: center; justify-content: center"><img src="assets/BO29.png" alt="" style="width: 32px; height: 32px; object-fit: contain"></button>
            
              <button aria-label="Students United" style="width: 44px; height: 44px; padding: 0; cursor: pointer; background: #0E1728; border: 1px solid rgba(227,179,65,.22); border-radius: 0px; display: flex; align-items: center; justify-content: center"><img src="assets/BO11.png" alt="" style="width: 32px; height: 32px; object-fit: contain"></button>
            
              <button aria-label="Local Kōenkai" style="width: 44px; height: 44px; padding: 0; cursor: pointer; background: #0E1728; border: 1px solid rgba(227,179,65,.22); border-radius: 0px; display: flex; align-items: center; justify-content: center"><img src="assets/BO03.png" alt="" style="width: 32px; height: 32px; object-fit: contain"></button>
            
          </div>
        </div>
      
        <div style="display: flex; flex-direction: column; gap: 5px; padding-top: 7px; border-top: 1px solid rgba(227,179,65,.22)">
          <span style="font-size: 12px; font-weight: 700; color: #FF8A80">Annoyed</span>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            
              <button aria-label="Taxpayers' Alliance" style="width: 44px; height: 44px; padding: 0; cursor: pointer; background: #0E1728; border: 1px solid rgba(227,179,65,.22); border-radius: 0px; display: flex; align-items: center; justify-content: center"><img src="assets/BO23.png" alt="" style="width: 32px; height: 32px; object-fit: contain"></button>
            
          </div>
        </div>
      
      <span style="font-size: 11.5px; color: #B9C0CF">Tap an organization to see its name.</span>
      <span style="font-size: 12.5px; font-weight: 700; padding-top: 6px; border-top: 1px solid rgba(227,179,65,.22)">You start 3 ahead at the floor debate.</span>
      <button style="min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 700; cursor: pointer; background: #E3B341; color: #0B1220; border: 1px solid #E3B341; border-radius: 0px; clip-path: polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); font-family: 'Barlow Condensed', sans-serif; font-style: italic; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px">On to the next stage</button>
      <span style="font-size: 11px; color: #B9C0CF; text-align: center">Hold for 2 seconds</span>
    </section>
  </div>
</div>


</body>
</html>
