<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Conversation screens (living)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>



<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2B1D12; color: #FFF8EC; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px 8px 16px">
    <div style="display: flex; align-items: baseline; gap: 8px"><h1 style="margin: 0; font-family: 'Antaka Brush Display', 'Zen Kaku Gothic New', sans-serif; font-size: 24px; font-style: normal; font-weight: 400; line-height: 1.15; text-transform: none; font-size: 22px; color: #FFF8EC">Office Hours</h1><span lang="ja" style="font-size: 12px; color: #D9C8AC">陳情</span></div>
    <span style="padding: 4px 10px; font-size: 12px; font-weight: 700; background: #FFD58A; color: #2B1D12; border-radius: 999px; clip-path: none; white-space: nowrap">Visitor 2 of 3</span>
  </div>
  <div style="position: relative; flex: 0 0 372px; overflow: hidden; border-bottom: 1px solid rgba(255,248,236,.15)">
    <img src="assets/ST07.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
    <img src="assets/VI02.png" alt="Gen Tsukamoto" style="position: absolute; left: 50%; bottom: -40px; transform: translateX(-50%); height: 392px; width: auto">
    <div style="position: absolute; left: 12px; top: 12px; max-width: 220px; padding: 7px 11px; background: #FFF8EC; color: #2B1D12; border: 1px solid #E8DAC3; border-radius: 12px; clip-path: none; box-shadow: 0 8px 20px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 15px; font-weight: 700; font-family: 'Zen Kaku Gothic New', sans-serif; font-style: normal; text-transform: none">Gen Tsukamoto</span>
      <span style="font-size: 11.5px; color: #5C4A38">Fisherman · 塚本玄</span>
    </div>
    <div style="position: absolute; right: 10px; top: 12px; display: flex; flex-direction: column; gap: 6px">
      
        <span style="width: 40px; height: 40px; background: #FFF8EC; border: 1px solid #E8DAC3; border-radius: 50%; display: flex; align-items: center; justify-content: center"><img src="assets/BO07.png" alt="Fisheries Cooperative" style="width: 30px; height: 30px; object-fit: contain"></span>
      
        <span style="width: 40px; height: 40px; background: #FFF8EC; border: 1px solid #E8DAC3; border-radius: 50%; display: flex; align-items: center; justify-content: center"><img src="assets/BO04.png" alt="Mayors' Network" style="width: 30px; height: 30px; object-fit: contain"></span>
      
        <span style="width: 40px; height: 40px; background: #FFF8EC; border: 1px solid #E8DAC3; border-radius: 50%; display: flex; align-items: center; justify-content: center"><img src="assets/BO23.png" alt="Taxpayers' Alliance" style="width: 30px; height: 30px; object-fit: contain"></span>
      
    </div>
  </div>
  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 16px 14px 16px; display: flex; flex-direction: column; gap: 9px">
      <div style="background: #FFF8EC; color: #2B1D12; border-top: 1px solid #E2CFAF; border-bottom: 1px solid #E2CFAF; border-left: 1px solid #E2CFAF; border-right: 1px solid #E2CFAF; border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,.35); box-sizing: border-box; padding: 10px 12px; font-size: 14px; font-weight: 700; line-height: 1.45">Rausu harbor is silting up. Will you carry the dredging request to the capital?</div>
      <div style="display: flex; flex-direction: column; gap: 7px">
        
          <button style="width: 100%; min-height: 52px; padding: 9px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; font-size: 13.5px; font-weight: 700; line-height: 1.3; cursor: pointer; background: #F3E4C8; color: #2B1D12; border: 1px solid rgba(43,29,18,.14); border-radius: 12px; font-family: 'Zen Kaku Gothic New', sans-serif; box-sizing: border-box; background: #FFF8EC; color: #2B1D12; border: 1px solid #E8DAC3"><span style="display: flex; gap: 8px; align-items: baseline"><span style="flex: 0 0 auto; font-size: 12px; color: #5C4A38">A</span><span>Dredging is costly; we need a cost study first.</span></span><span style="font-size: 11.5px; font-weight: 600; color: #5C4A38"></span></button>
        
          <button style="width: 100%; min-height: 52px; padding: 9px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; font-size: 13.5px; font-weight: 700; line-height: 1.3; cursor: pointer; background: #F3E4C8; color: #2B1D12; border: 1px solid rgba(43,29,18,.14); border-radius: 12px; font-family: 'Zen Kaku Gothic New', sans-serif; box-sizing: border-box; background: #FFF8EC; color: #2B1D12; border: 1px solid #E8DAC3"><span style="display: flex; gap: 8px; align-items: baseline"><span style="flex: 0 0 auto; font-size: 12px; color: #5C4A38">B</span><span>I'll carry it there and keep asking.</span></span><span style="font-size: 11.5px; font-weight: 600; color: #5C4A38"></span></button>
        
          <button style="width: 100%; min-height: 52px; padding: 9px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; font-size: 13.5px; font-weight: 700; line-height: 1.3; cursor: pointer; background: #F3E4C8; color: #2B1D12; border: 1px solid rgba(43,29,18,.14); border-radius: 12px; font-family: 'Zen Kaku Gothic New', sans-serif; box-sizing: border-box; background: #FFF8EC; color: #2B1D12; border: 1px solid #E8DAC3"><span style="display: flex; gap: 8px; align-items: baseline"><span style="flex: 0 0 auto; font-size: 12px; color: #5C4A38">C</span><span>Use the larger harbor down the coast meanwhile.</span></span><span style="font-size: 11.5px; font-weight: 600; color: #5C4A38"></span></button>
        
          <button style="width: 100%; min-height: 52px; padding: 9px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; font-size: 13.5px; font-weight: 700; line-height: 1.3; cursor: pointer; background: #F3E4C8; color: #2B1D12; border: 1px solid rgba(43,29,18,.14); border-radius: 12px; font-family: 'Zen Kaku Gothic New', sans-serif; box-sizing: border-box; background: #FFF8EC; color: #2B1D12; border: 1px solid #E8DAC3"><span style="display: flex; gap: 8px; align-items: baseline"><span style="flex: 0 0 auto; font-size: 12px; color: #5C4A38">D</span><span>Put it in writing so it joins the queue.</span></span><span style="font-size: 11.5px; font-weight: 600; color: #5C4A38"></span></button>
        
      </div>
  </div>
</div>






</body>
</html>
