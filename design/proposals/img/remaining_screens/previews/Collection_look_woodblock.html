<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Cards and items (woodblock)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>





<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFE4CF; color: #1C1A17; font-family: 'Shippori Mincho B1', serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <img src="assets/OFFICE.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: rgba(28,26,23,.55)"></div>
  <div style="position: relative; flex: 1 1 auto; padding: 18px 14px; display: flex; flex-direction: column; justify-content: center">
    <section role="dialog" aria-label="Call for Unity" style="background: #F8F1E3; color: #1C1A17; border-top: 2px solid #1C1A17; border-bottom: 2px solid #1C1A17; border-left: 2px solid #1C1A17; border-right: 2px solid #1C1A17; border-radius: 0px; box-shadow: 4px 4px 0 #C23B22; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      
        <div style="width: 210px; align-self: center">
          <div style="position: relative; display: flex; flex-direction: column; background: #F8F1E3; color: #1C1A17; border: 2px solid #B7791F; border-radius: 0px; overflow: hidden; box-shadow: 4px 4px 0 #C23B22">
            <img src="assets/C09.jpg" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block">
            <span style="position: absolute; left: 5px; top: 5px; width: 26px; height: 26px; border-radius: 50%; background: #B7791F; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
            <div style="padding: 6px 7px 7px 7px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12.5px; font-weight: 700; line-height: 1.2">Call for Unity</span>
              <span style="font-size: 10.5px; color: #4E463C">Appeal · Gain</span>
              <span style="font-size: 11px; line-height: 1.3">Gain 4; +2 more if Party Members ≥ 50%.</span>
            </div>
          </div>
        </div>
      
      <span lang="ja" style="font-size: 12px; text-align: center; color: #4E463C">結束を呼びかける · Kessoku o Yobikakeru</span>
      <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid rgba(28,26,23,.22)">
        <span style="font-size: 12.5px; font-weight: 700">Appeal · Gain · costs 2</span>
        <span style="font-size: 12.5px">Gain 4; +2 more if Party Members ≥ 50%.</span>
        <span style="font-size: 12px; color: #4E463C">Tier 1 · in your deck</span>
      </div>
      <button style="min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 700; cursor: pointer; background: #22305A; color: #F8F1E3; border: 2px solid #22305A; border-radius: 0px; clip-path: none; font-family: 'Shippori Mincho B1', serif; font-style: normal; text-transform: none; letter-spacing: 0">Close</button>
    </section>
  </div>
</div>



</body>
</html>
