<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Cards and items (woodblock)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>



<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFE4CF; color: #1C1A17; font-family: 'Shippori Mincho B1', serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 10px 16px 12px 16px; flex: 1 1 auto; min-height: 0; overflow-y: auto">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 44px; flex: 0 0 auto">
      <a href="#office" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px; font-size: 14px; font-weight: 600; text-decoration: none; color: #1C1A17">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
        Office
      </a>
      <div style="display: flex; gap: 6px">
        
          <span style="padding: 5px 10px; font-size: 12px; font-weight: 700; background: #22305A; color: #F8F1E3; border-radius: 0px; clip-path: none; white-space: nowrap">XP 1,240</span>
        
      </div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; flex: 0 0 auto">
      <h1 style="margin: 0; font-family: 'Antaka Brush Display', 'Shippori Mincho B1', serif; font-size: 27px; font-style: normal; font-weight: 400; line-height: 1.1; text-transform: none; color: #1C1A17">Your Deck</h1>
      <span lang="ja" style="font-size: 12px; color: #6B5F50">手札</span>
    </div>
    <div role="tablist" style="display: flex; gap: 6px; flex: 0 0 auto; overflow-x: auto">
      
        <button role="tab" style="flex: 0 0 auto; min-height: 36px; padding: 0 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; background: #22305A; color: #F8F1E3; border: 2px solid #22305A; border-radius: 0px; clip-path: none; font-family: 'Shippori Mincho B1', serif">In your deck</button>
      
        <button role="tab" style="flex: 0 0 auto; min-height: 36px; padding: 0 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; background: #F8F1E3; color: #1C1A17; border: 2px solid #1C1A17; border-radius: 0px; clip-path: none; font-family: 'Shippori Mincho B1', serif">Collection</button>
      
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: #463F36"><span>Deck 12 of 12 cards · ready to play</span><span>Tap a card to look</span></div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="display: flex; align-items: center; gap: 5px; padding: 3px 9px; font-size: 11.5px; font-weight: 700; background: #F8F1E3; color: #1C1A17; border-radius: 0px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #2F6B9A"></span>Earnest 6</span><span style="display: flex; align-items: center; gap: 5px; padding: 3px 9px; font-size: 11.5px; font-weight: 700; background: #F8F1E3; color: #1C1A17; border-radius: 0px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #B3311C"></span>Emotional 3</span><span style="display: flex; align-items: center; gap: 5px; padding: 3px 9px; font-size: 11.5px; font-weight: 700; background: #F8F1E3; color: #1C1A17; border-radius: 0px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #B7791F"></span>Appeal 3</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      
        <button aria-label="Sincere Answer" style="padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; font-family: 'Shippori Mincho B1', serif">
          <div style="position: relative; display: flex; flex-direction: column; background: #F8F1E3; color: #1C1A17; border: 2px solid #2F6B9A; border-radius: 0px; overflow: hidden; box-shadow: 4px 4px 0 #C23B22">
            <img src="assets/C02.jpg" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block">
            <span style="position: absolute; left: 5px; top: 5px; width: 26px; height: 26px; border-radius: 50%; background: #2F6B9A; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
            <div style="padding: 6px 7px 7px 7px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12.5px; font-weight: 700; line-height: 1.2">Sincere Answer</span>
              <span style="font-size: 10.5px; color: #4E463C">Earnest · Defend</span>
              <span style="font-size: 11px; line-height: 1.3">Gain 1. Guard 4.</span>
            </div>
          </div>
        </button>
      
        <button aria-label="Impassioned Speech" style="padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; font-family: 'Shippori Mincho B1', serif">
          <div style="position: relative; display: flex; flex-direction: column; background: #F8F1E3; color: #1C1A17; border: 2px solid #B3311C; border-radius: 0px; overflow: hidden; box-shadow: 4px 4px 0 #C23B22">
            <img src="assets/C05.jpg" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block">
            <span style="position: absolute; left: 5px; top: 5px; width: 26px; height: 26px; border-radius: 50%; background: #B3311C; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
            <div style="padding: 6px 7px 7px 7px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12.5px; font-weight: 700; line-height: 1.2">Impassioned Speech</span>
              <span style="font-size: 10.5px; color: #4E463C">Emotional · Gain</span>
              <span style="font-size: 11px; line-height: 1.3">Gain 5.</span>
            </div>
          </div>
        </button>
      
        <button aria-label="Call for Unity" style="padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; font-family: 'Shippori Mincho B1', serif">
          <div style="position: relative; display: flex; flex-direction: column; background: #F8F1E3; color: #1C1A17; border: 2px solid #B7791F; border-radius: 0px; overflow: hidden; box-shadow: 4px 4px 0 #C23B22">
            <img src="assets/C09.jpg" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block">
            <span style="position: absolute; left: 5px; top: 5px; width: 26px; height: 26px; border-radius: 50%; background: #B7791F; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
            <div style="padding: 6px 7px 7px 7px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12.5px; font-weight: 700; line-height: 1.2">Call for Unity</span>
              <span style="font-size: 10.5px; color: #4E463C">Appeal · Gain</span>
              <span style="font-size: 11px; line-height: 1.3">Gain 4; +2 more if Party Members ≥ 50%.</span>
            </div>
          </div>
        </button>
      
        <button aria-label="Record of Service" style="padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; font-family: 'Shippori Mincho B1', serif">
          <div style="position: relative; display: flex; flex-direction: column; background: #F8F1E3; color: #1C1A17; border: 2px solid #2F6B9A; border-radius: 0px; overflow: hidden; box-shadow: 4px 4px 0 #C23B22">
            <img src="assets/C01.jpg" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block">
            <span style="position: absolute; left: 5px; top: 5px; width: 26px; height: 26px; border-radius: 50%; background: #2F6B9A; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
            <div style="padding: 6px 7px 7px 7px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12.5px; font-weight: 700; line-height: 1.2">Record of Service</span>
              <span style="font-size: 10.5px; color: #4E463C">Earnest · Gain</span>
              <span style="font-size: 11px; line-height: 1.3">Gain 4.</span>
            </div>
          </div>
        </button>
      
        <button aria-label="Formal Apology" style="padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; font-family: 'Shippori Mincho B1', serif">
          <div style="position: relative; display: flex; flex-direction: column; background: #F8F1E3; color: #1C1A17; border: 2px solid #2F6B9A; border-radius: 0px; overflow: hidden; box-shadow: 4px 4px 0 #C23B22">
            <img src="assets/C03.jpg" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block">
            <span style="position: absolute; left: 5px; top: 5px; width: 26px; height: 26px; border-radius: 50%; background: #2F6B9A; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
            <div style="padding: 6px 7px 7px 7px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12.5px; font-weight: 700; line-height: 1.2">Formal Apology</span>
              <span style="font-size: 10.5px; color: #4E463C">Earnest · Gain</span>
              <span style="font-size: 11px; line-height: 1.3">Gain 2. Reduce your gaffe meter by 2.</span>
            </div>
          </div>
        </button>
      
        <button aria-label="Return to First Principles" style="padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; font-family: 'Shippori Mincho B1', serif">
          <div style="position: relative; display: flex; flex-direction: column; background: #F8F1E3; color: #1C1A17; border: 2px solid #2F6B9A; border-radius: 0px; overflow: hidden; box-shadow: 4px 4px 0 #C23B22">
            <img src="assets/C04.jpg" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block">
            <span style="position: absolute; left: 5px; top: 5px; width: 26px; height: 26px; border-radius: 50%; background: #2F6B9A; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
            <div style="padding: 6px 7px 7px 7px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12.5px; font-weight: 700; line-height: 1.2">Return to First Principles</span>
              <span style="font-size: 10.5px; color: #4E463C">Earnest · Gain</span>
              <span style="font-size: 11px; line-height: 1.3">Gain 6; +2 more if Constituents ≥ 30%.</span>
            </div>
          </div>
        </button>
      
    </div>
  </div>
</div>





</body>
</html>
