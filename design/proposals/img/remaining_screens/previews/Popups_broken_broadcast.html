<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pop-ups and notices (broadcast)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>









<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1220; color: #F4F1EA; font-family: 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <img src="assets/OFFICE.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: rgba(5,9,18,.66)"></div>
  <div style="position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 18px 14px">
    <section role="dialog" aria-label="Promises broken" style="background: #141E33; color: #F4F1EA; border-top: 2px solid #E3B341; border-bottom: 2px solid #E3B341; border-left: 0px solid transparent; border-right: 0px solid transparent; border-radius: 0px; box-shadow: none; box-sizing: border-box; max-height: 100%; display: flex; flex-direction: column; overflow: hidden">
      <div style="padding: 14px 16px 8px 16px; display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span style="padding: 3px 9px; font-size: 11px; font-weight: 700; letter-spacing: .08em; background: #C8102E; color: #FFFFFF; border-radius: 0px; clip-path: polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); white-space: nowrap">PROMISE BROKEN</span><span style="font-size: 12px; font-weight: 700; color: #B9C0CF">Week 7</span></div>
        <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-style: italic; font-weight: 700; line-height: 1.15; text-transform: uppercase; color: #F4F1EA">Promises broken</h1>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 16px 12px 16px; display: flex; flex-direction: column; gap: 10px">
        <p style="margin: 0; font-size: 13.5px; line-height: 1.5">You broke your promise to Buddhist Temples Association: 1 hour of your time.</p>
        <div style="display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: #3A1F27; color: #FFB4AB; border-radius: 0px">
          <img src="assets/BO19.png" alt="" style="width: 30px; height: 30px; object-fit: contain">
          <span style="flex: 1 1 auto; font-size: 13px; font-weight: 700">Buddhist Temples Association</span>
          <span style="font-size: 15px; font-weight: 700">−4</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 13px; padding-top: 6px; border-top: 1px solid rgba(227,179,65,.22)"><span>Reputation</span><span style="font-weight: 700; color: #FF8A80">−2</span></div>
      </div>
      <div style="flex: 0 0 auto; padding: 12px 16px 16px 16px; display: flex; gap: 8px; border-top: 1px solid rgba(227,179,65,.22)">
        <button style="min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 700; cursor: pointer; background: #E3B341; color: #0B1220; border: 1px solid #E3B341; border-radius: 0px; clip-path: polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); font-family: 'Barlow Condensed', sans-serif; font-style: italic; text-transform: uppercase; letter-spacing: .04em; flex: 1 1 auto">Close</button>
      </div>
    </section>
  </div>
</div>




</body>
</html>
