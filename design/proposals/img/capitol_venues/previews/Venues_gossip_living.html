<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Venue tips and gossip (living)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>




<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2B1D12; color: #FFF8EC; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="position: absolute; inset: 0; background: #F3E4C8; display: flex; align-items: flex-start; justify-content: center; padding-top: 40px">
    <span style="font-size: 11px; letter-spacing: .08em; color: #5C4A38">CAFETERIA · picture not drawn yet</span>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(20,12,6,.62)"></div>
  <div style="position: relative; flex: 1 1 auto; min-height: 0; padding: 18px 14px; display: flex; flex-direction: column; justify-content: center">
    <section role="dialog" aria-label="Lunch with colleagues" style="background: #FFF8EC; color: #2B1D12; border-top: 1px solid #E2CFAF; border-bottom: 1px solid #E2CFAF; border-left: 1px solid #E2CFAF; border-right: 1px solid #E2CFAF; border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,.35); box-sizing: border-box; max-height: 100%; display: flex; flex-direction: column; overflow: hidden">
      <div style="padding: 14px 16px 8px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px">
        <span style="padding: 3px 9px; font-size: 11px; font-weight: 700; letter-spacing: .06em; background: #FFD58A; color: #2B1D12; border-radius: 12px; clip-path: none; white-space: nowrap">CAFETERIA · LUNCH</span>
        <span style="font-size: 12px; font-weight: 700; color: #5C4A38">Line 5 of 8 today</span>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 16px 14px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; gap: 12px; align-items: flex-start">
          <div style="flex: 0 0 auto; width: 64px; height: 84px; background: #F3E4C8; border-radius: 12px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center"><img src="assets/OP01.png" alt="Ayala Taiyounokage" style="height: 82px; width: auto; max-width: 64px; object-fit: cover; object-position: top"></div>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px">
            <p style="margin: 0; font-size: 15px; line-height: 1.5; font-family: 'Zen Kaku Gothic New', sans-serif">“Five seats, five opinions. We call it a caucus.”</p>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700"><span style="width: 10px; height: 10px; border-radius: 50%; background: #8000FF; border: 1px solid #2B1D12" aria-hidden="true"></span>— Ayala Taiyounokage</span>
            <span style="font-size: 11.5px; color: #5C4A38">Five Point Independents · at the next table</span>
          </div>
        </div>
        <span style="font-size: 12px; color: #5C4A38">Gossip only. Nothing changes.</span>
      </div>
      <div style="flex: 0 0 auto; padding: 12px 16px 16px 16px; display: flex; gap: 8px; border-top: 1px solid rgba(43,29,18,.14)">
        <button style="min-height: 44px; padding: 0 14px; font-size: 13.5px; font-weight: 700; cursor: pointer; background: transparent; color: #2B1D12; border: 1px solid #5C4A38; border-radius: 999px; clip-path: none; font-family: 'Zen Kaku Gothic New', sans-serif; flex: 1 1 0">Back to the Cafeteria</button>
        <button style="min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 700; cursor: pointer; background: #FFD58A; color: #2B1D12; border: 1px solid #FFD58A; border-radius: 999px; clip-path: none; font-family: 'Zen Kaku Gothic New', sans-serif; font-style: normal; text-transform: none; letter-spacing: 0; flex: 1.4 1 0; font-size: 14px">Keep listening</button>
      </div>
    </section>
  </div>
</div>







</body>
</html>
