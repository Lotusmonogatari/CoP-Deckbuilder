<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Venue tips and gossip (broadcast)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho+B1:wght@400;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url('assets/BarlowCondensed-BoldItalic.woff2') format('woff2')}
@font-face{font-family:'Antaka Brush Display';src:url('assets/AntakaBrushDisplay-Regular.ttf') format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit}
</style>

</head>
<body>






<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1220; color: #F4F1EA; font-family: 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="position: absolute; inset: 0; background: #0E1728; display: flex; align-items: flex-start; justify-content: center; padding-top: 40px">
    <span style="font-size: 11px; letter-spacing: .08em; color: #B9C0CF">CAFETERIA · picture not drawn yet</span>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(5,9,18,.66)"></div>
  <div style="position: relative; flex: 1 1 auto; min-height: 0; padding: 18px 14px; display: flex; flex-direction: column; justify-content: center">
    <section role="dialog" aria-label="Lunch with colleagues" style="background: #141E33; color: #F4F1EA; border-top: 2px solid #E3B341; border-bottom: 2px solid #E3B341; border-left: 0px solid transparent; border-right: 0px solid transparent; border-radius: 0px; box-shadow: none; box-sizing: border-box; max-height: 100%; display: flex; flex-direction: column; overflow: hidden">
      <div style="padding: 14px 16px 8px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px">
        <span style="padding: 3px 9px; font-size: 11px; font-weight: 700; letter-spacing: .06em; background: #E3B341; color: #0B1220; border-radius: 0px; clip-path: polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); white-space: nowrap">CAFETERIA · LUNCH</span>
        <span style="font-size: 12px; font-weight: 700; color: #B9C0CF">8 of 8 heard today</span>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 16px 14px 16px; display: flex; flex-direction: column; gap: 12px">
        <p style="margin: 0; font-size: 16px; line-height: 1.5; font-style: italic; font-family: 'Barlow Condensed', sans-serif">The rumor mill is on the same subjects as before.</p>
        <span style="font-size: 12px; color: #B9C0CF">New talk tomorrow. Lunch still counts toward your day.</span>
      </div>
      <div style="flex: 0 0 auto; padding: 12px 16px 16px 16px; display: flex; gap: 8px; border-top: 1px solid rgba(227,179,65,.22)">
        <button style="min-height: 44px; padding: 0 14px; font-size: 13.5px; font-weight: 700; cursor: pointer; background: transparent; color: #F4F1EA; border: 1px solid #B9C0CF; border-radius: 0px; clip-path: polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); font-family: 'Noto Sans JP', sans-serif; flex: 1 1 0">Back to the Cafeteria</button>
        <button aria-disabled="true" style="min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 700; cursor: pointer; background: #E3B341; color: #0B1220; border: 1px solid #E3B341; border-radius: 0px; clip-path: polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); font-family: 'Barlow Condensed', sans-serif; font-style: italic; text-transform: uppercase; letter-spacing: .04em; flex: 1.4 1 0; font-size: 13px; opacity: .45">Come back tomorrow</button>
      </div>
    </section>
  </div>
</div>





</body>
</html>
