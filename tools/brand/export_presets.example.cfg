; Export presets for Coliseum of Parliament (P10, 2026-11-18). Copy this file to the project root as
; export_presets.cfg (the repo ignores that name on purpose: a real preset can carry signing details).
; Every icon below is a file in assets/brand/ (rebuilt by tools/brand/export_brand.gd). Fill in the marked
; placeholders before a real build: package name, signing, and (iOS) the Apple team.
;
; Godot fills every option not listed here with its default when it opens the file.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="design/*, tools/*, tests/*, audit/*, addons/gut/*"
export_path="build/coliseum.aab"

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=1
gradle_build/min_sdk=""
gradle_build/target_sdk=""
launcher_icons/main_192x192="res://assets/brand/icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/brand/adaptive_foreground_432.png"
launcher_icons/adaptive_background_432x432="res://assets/brand/adaptive_background_432.png"
launcher_icons/adaptive_monochrome_432x432="res://assets/brand/adaptive_monochrome_432.png"
version/code=1
version/name="0.1.0"
; PLACEHOLDER: the real package name is Cameron's to choose (it cannot change once published).
package/unique_name="com.example.coliseumofparliament"
; The short name under the phone icon (Cameron, 2026-11-18).
package/name="Coliseum"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false

[preset.1]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="design/*, tools/*, tests/*, audit/*, addons/gut/*"
export_path="build/ios/coliseum.ipa"

[preset.1.options]

; PLACEHOLDER: the real bundle identifier and Apple team are Cameron's.
application/bundle_identifier="com.example.coliseumofparliament"
application/short_version="0.1.0"
application/version="0.1.0"
application/app_store_team_id=""
application/targeted_device_family=0
application/min_ios_version="14.0"
application/icon_interpolation=4
icons/icon_1024x1024="res://assets/brand/icon_1024.png"
icons/app_store_1024x1024="res://assets/brand/icon_1024.png"
icons/iphone_120x120="res://assets/brand/icon_120.png"
icons/iphone_180x180="res://assets/brand/icon_180.png"
icons/ipad_152x152="res://assets/brand/icon_152.png"
icons/ipad_167x167="res://assets/brand/icon_167.png"
icons/spotlight_80x80="res://assets/brand/icon_80.png"
icons/spotlight_120x120="res://assets/brand/icon_120.png"
icons/settings_58x58="res://assets/brand/icon_58.png"
icons/settings_87x87="res://assets/brand/icon_87.png"
icons/notification_40x40="res://assets/brand/icon_40.png"
icons/notification_60x60="res://assets/brand/icon_60.png"
icons/notification_76x76="res://assets/brand/icon_76.png"
icons/notification_114x114="res://assets/brand/icon_114.png"
