<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coliseum of Parliament</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400&display=swap">

<style>
/* A chamber at night: one committed visual world, dark in every theme, with
   everything painted explicitly so it holds on either host ground. */
:root {
  --ink:       #0E1015;
  --surface:   #171A22;
  --raised:    #1F232D;
  --line:      #2B303C;
  --text:      #EDEAE3;
  --muted:     #8D93A3;
  --player:    #5B9BD5;
  --opponent:  #C4695F;
  --undecided: #333845;
  --energy:    #E8C55C;
  --warn:      #E2645A;
  --brass:     #C9A227;

  /* Cameron's card template, baked into the page by the build script so the
     file stays one self-contained thing he can open from a link. */
  --frame-front: url("/*{{FRAME_FRONT}}*/");
  --frame-back: url("/*{{FRAME_BACK}}*/");
  /* The frame's own cream, for the cost disc the artwork leaves hollow, and
     a knocked-back version for the empty picture window. */
  --card-cream: #F6F1E5;
  --card-plate: #E6DFD1;
  --card-ink:   #29211A;
  --card-faint: #736152;

  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --jp: "Noto Sans JP", var(--body);

  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

#screen {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 430px;
  min-height: 100%;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 24px;
}

h1, h2 { margin: 0; font-family: var(--display); font-weight: 600; text-wrap: balance; }

.jp { font-family: var(--jp); color: var(--muted); font-size: 12px; }

.label {
  font-family: var(--body);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}

/* --- buttons ------------------------------------------------------------ */

button { font: inherit; cursor: pointer; border: none; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.primary {
  width: 100%;
  padding: 15px;
  border-radius: 3px;
  background: var(--brass);
  color: #15120A;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.primary:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

.ghost {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: transparent;
  color: var(--text);
}

.link {
  padding: 0;
  background: none;
  color: var(--text);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* --- placeholder art ---------------------------------------------------- */

.art {
  --art-hue: 220;
  --art-size: 92px;
  display: grid;
  place-items: center;
  width: 100%;
  height: var(--art-size);
  border-radius: 2px;
  background: hsl(var(--art-hue) 22% 34%);
}
.art-id {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: hsl(var(--art-hue) 30% 88%);
}

/* --- the Office --------------------------------------------------------- */

.office { justify-content: flex-start; }
.office-name { font-size: 27px; letter-spacing: -0.01em; }
.office-report { margin: 0; color: var(--muted); }

.standing { border-top: 1px solid var(--line); padding-top: 12px; }
.standing-grid {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 5px 12px;
  margin: 9px 0 0;
}
.standing-grid dt { color: var(--muted); }
.standing-grid dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.delta { font-size: 12px; font-weight: 700; }
.delta.up { color: var(--player); }
.delta.down { color: var(--opponent); }

/* --- a battle ----------------------------------------------------------- */

.battle-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.stage-name { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.stage-name h1 { font-size: 21px; }
.turn { color: var(--muted); font-size: 13px; white-space: nowrap; }

/* The speaker sits beside their portrait rather than under it: a full-width
   block pushed the hand off the bottom of a short phone. */
.speaker { display: flex; align-items: flex-start; gap: 12px; }
.speaker .art { flex: 0 0 64px; }
.speaker-text { flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.speaker h2 { font-size: 18px; }
.says { margin: 0; color: var(--text); }

.bar-wrap { display: flex; flex-direction: column; gap: 5px; }
.bar-caption { margin: 0; font-size: 13px; color: var(--muted); }
.bar {
  position: relative;
  display: flex;
  height: 26px;
  border-radius: 2px;
  background: var(--undecided);
  overflow: hidden;
}
.bar-mine { background: var(--player); }
.bar-theirs { margin-left: auto; background: var(--opponent); }
.bar-line {
  position: absolute;
  top: -3px;
  bottom: -3px;
  width: 2px;
  background: rgba(255, 255, 255, 0.85);
}
.bar-readout { margin: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* What just happened, in the room's own units. The card's numbers are a
   budget and the outcome depends on who is left to win over. */
.flash { margin: 0; font-size: 12.5px; color: var(--energy); }

.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pips { display: flex; gap: 6px; }
.pip { width: 13px; height: 13px; border-radius: 50%; background: var(--line); }
.pip.on { background: var(--energy); }
.status-right { display: flex; align-items: center; gap: 14px; font-size: 13px; }
.gaffes { color: var(--muted); font-variant-numeric: tabular-nums; }
.gaffes.warn { color: var(--warn); font-weight: 700; }
.guarding { color: var(--player); font-weight: 700; font-variant-numeric: tabular-nums; }

/* The hand and the End turn button belong at the bottom of the screen,
   where a thumb is, so the slack goes above them. Capping this moved the
   empty space BELOW the button instead, which is worse. */
.spacer { flex: 1 1 auto; min-height: 8px; }

/* --- the hand ----------------------------------------------------------- */

.hand {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: thin;
}
.empty-hand { margin: 0; color: var(--muted); font-size: 13px; }

/* The card is Cameron's front frame with text laid over the regions the
   artwork already draws: a cost disc top left, a name bar beside it, a
   picture window, a box across the lower third, and a footer strip.
   THE PERCENTAGES ARE THE SAME NUMBERS AS scripts/ui/CardView.gd, measured
   off the 1429x2000 PNG. If the frame is redrawn, change them in both. */
.card {
  --suit: var(--line);
  --card-w: 160px;
  position: relative;
  flex: 0 0 var(--card-w);
  width: var(--card-w);
  /* The frame's own proportions, 1429:2000, so it is never stretched. */
  height: calc(var(--card-w) / 0.7145);
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--card-ink);
  text-align: left;
  font-family: var(--body);
}
.card.unaffordable { opacity: 0.45; }
/* Every number on this card is inert in this room, so playing it is a
   decision rather than a discovery. */
.card.useless { opacity: 0.5; }

/* The picture window is transparent in the template. Left alone it shows the
   dark page behind the card, so a cream card reads as having a hole punched
   through it. Art will cover this completely. */
.card-plate {
  position: absolute;
  left: 12%; top: 16%; width: 76%; height: 43.6%;
  background: var(--card-plate);
}
.card-frame {
  position: absolute;
  inset: 0;
  background-image: var(--frame-front);
  background-size: 100% 100%;
}
/* Above the frame, because the disc is a HOLE in the artwork rather than a
   white circle: the game fills it. */
.card-cost {
  position: absolute;
  left: 5.88%; top: 3.30%; width: 9.80%; height: 7.05%;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--card-cream);
  font-family: var(--display);
  font-size: calc(var(--card-w) * 0.115);
  font-weight: 600;
  color: var(--card-ink);
  line-height: 1;
}
.card-name {
  position: absolute;
  left: 21.5%; top: 4.2%; width: 65.5%; height: 5.6%;
  /* A block, not a centred flex item: a flex item that does not fit
     overflows at BOTH ends, so the name lost its first letters as well as
     its last and text-overflow never got a chance. */
  display: block;
  text-align: center;
  font-weight: 700;
  font-size: calc(var(--card-w) * 0.072);
  line-height: calc(var(--card-w) / 0.7145 * 0.056);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* The Japanese name sits in the empty picture window rather than crowding
   the name bar, which holds one line. */
.card-jp {
  position: absolute;
  left: 12%; top: 16%; width: 76%; height: 43.6%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--jp);
  font-size: calc(var(--card-w) * 0.086);
  color: var(--card-faint);
}
.card-text {
  position: absolute;
  left: 12.8%; top: 67.6%; width: 74.4%; height: 20%;
  margin: 0;
  overflow: hidden;
  font-size: calc(var(--card-w) * 0.065);
  line-height: 1.22;
  color: var(--card-ink);
}
/* The suit, as a band along the footer strip the frame already draws. The
   frame is one colour for every card, so without this a hand cannot be read
   by shape at a glance. */
.card-band {
  position: absolute;
  left: 4.5%; top: 91.2%; width: 84.5%; height: 6.2%;
  background: var(--suit);
}

/* The card turned over: the same frame's back, with the full text on its
   ruled paper. The rules run at 10.10% and every 7.15% after it, so the line
   height is set to match and each line lands between two of them. */
.card-back {
  --card-w: 300px;
  position: relative;
  width: var(--card-w);
  height: calc(var(--card-w) / 0.7145);
  margin: 0 auto;
  color: var(--card-ink);
}
.card-back .card-frame { background-image: var(--frame-back); }
.card-back-text {
  position: absolute;
  left: 7%; top: 10.1%; width: 86%; height: 71.5%;
  margin: 0;
  overflow: hidden;
  font-size: calc(var(--card-w) * 0.0455);
  /* One rule to the next, exactly. */
  line-height: calc(var(--card-w) / 0.7145 * 0.0715);
}
.card-back-text b { font-weight: 700; }
.card-back-text .faint { color: var(--card-faint); }

/* One hue per suit, so the six are told apart at a glance without reading. */
.suit-earnest       { --suit: #6FA88B; }
.suit-emotional     { --suit: #C57B9C; }
.suit-appeal        { --suit: #D9A14E; }
.suit-data-driven   { --suit: #5B9BD5; }
.suit-divisive      { --suit: #9B7BC5; }
.suit-duplicitous   { --suit: #8A8F9E; }

/* --- overlays ----------------------------------------------------------- */

.backdrop {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
  background: rgba(6, 7, 10, 0.72);
  z-index: 10;
}
.sheet {
  display: flex;
  flex-direction: column;
  gap: 9px;
  width: 100%;
  max-width: 398px;
  max-height: 88%;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--raised);
  overflow-y: auto;
}
.sheet-title { font-size: 21px; }
.sheet .primary, .sheet .ghost { margin-top: 4px; }
.detail-line { margin: 0; font-size: 13.5px; }
.gap { height: 7px; }

/* The organisations, grouped by tier. */
.org-tier {
  margin: 10px 0 0;
  font-family: var(--display);
  font-size: 15px;
  font-weight: 600;
  color: var(--brass);
}
.org { display: flex; flex-direction: column; gap: 1px; }
.org-name { margin: 0; font-size: 13.5px; }
.org-standing { font-weight: 700; font-variant-numeric: tabular-nums; }
.org-boosts { margin: 0; font-size: 11.5px; color: var(--muted); line-height: 1.35; }

.zoom-meta { margin: 0; font-size: 13px; color: var(--muted); }
.zoom-text { margin: 0; }
.zoom-upgrade, .zoom-room { margin: 0; font-size: 13px; color: var(--muted); }

/* --- the rules check ---------------------------------------------------- */

.rules-check {
  margin: 0;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--muted);
}
.rules-check.failed { color: var(--warn); }
.problems { margin: 6px 0 0; padding-left: 18px; font-size: 12px; }
.problems li { margin-bottom: 4px; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
